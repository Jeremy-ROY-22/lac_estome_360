<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Lac d'estome</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #panorama { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="panorama"></div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "panorama.jpg", /* Votre fichier image */
    "autoLoad": true,            /* Démarre automatiquement */
    "autoRotate": -2,            /* Tourne doucement tout seul */
    "compass": false,
    "showControls": true         /* Permet à votre famille de zoomer / naviguer */
});
</script>

</body>
</html>
